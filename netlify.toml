# Netlify reads this on every push to the linked GitHub repo.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # The site is a plain static export (output: "export"), so Netlify's Next.js server runtime isn't needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Security and cache headers live in public/_headers (copied into out/).
